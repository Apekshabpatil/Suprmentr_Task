<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Component Hunt - YouTube</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
    font-size:small ;
}

body{
    padding:20px;
    background:#f4f4f4;
}

.navbar{
    background:#ff0000;
    color:white;
    padding:20px;
    text-align:center;
    margin-bottom:10px;
}

.container{
    display:flex;
    gap:10px;
}

.sidebar{
    width:25%;
    background:white;
    padding:20px;
    border:1px solid #ccc;
}

.main{
    width:75%;
    background:white;
    padding:20px;
    border:1px solid #ccc;
}

.video-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    margin-top:15px;
}

.video-card{
    background:#eaeaea;
    padding:40px;
    text-align:center;
    border-radius:8px;
}

.footer{
    margin-top:10px;
    background:#333;
    color:white;
    text-align:center;
    padding:15px;
}
</style>
</head>
<body>

<div class="navbar">
    Navbar (Logo | Search Bar | Profile)
</div>

<div class="container">

    <div class="sidebar">
        <h3>Sidebar</h3>
        <ul>
            <li>Home</li>
            <li>Shorts</li>
            <li>Subscriptions</li>
            <li>Library</li>
        </ul>
    </div>

    <div class="main">
        <h3>Main Content</h3>

        <div class="video-grid">
            <div class="video-card">Video Card 1</div>
            <div class="video-card">Video Card 2</div>
            <div class="video-card">Video Card 3</div>
            <div class="video-card">Video Card 4</div>
        </div>
    </div>

</div>

<div class="footer">
    Footer
</div>

</body>
</html>
